
name: Gemini Code Repair Live Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/week2-RL-feedback

permissions:
  contents: read

jobs:
  test-gemini-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      
      - name: Test live Gemini code correction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from agents.code_debugger import correct_python_code
          from agents.auto_repair import validate_repair_policy

          broken_code = "print(10 / 0)"
          safe_correction = "print(10 + 20)"

          with patch(
              "agents.code_debugger.generate_response",
              return_value=safe_correction,
          ):
              corrected_code = correct_python_code(
                  original_code=broken_code,
                  error_message="ZeroDivisionError: division by zero",
              )

          validate_repair_policy(corrected_code)

          assert corrected_code.strip() == safe_correction
          print("CODE CORRECTION LOGIC PASSED")
          print("CORRECTED CODE POLICY VALIDATION PASSED")
          PY


      

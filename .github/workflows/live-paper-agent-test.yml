
name: Live Paper-to-Agent Test

on:
  push:
    branches:
      - feature/agent-orchestration
    paths:
      - ".github/workflows/live-paper-agent-test.yml"
  workflow_dispatch:
  # Live integration test: paper retrieval and Gemini agents

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-dotenv requests arxiv pymupdf

      - name: Run live paper-to-agent test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from agents.orchestrator import run_research_from_papers

          assert os.getenv("GEMINI_API_KEY"), "Gemini secret missing"

          result = run_research_from_papers(
              research_topic="machine learning diabetes prediction",
              max_results=1,
          )

          assert result["paper_count"] >= 1
          assert result["literature_review"].strip()
          assert result["hypothesis"].strip()
          assert result["experiment"]["status"] == "not_executed"


          print("LIVE PAPER-TO-AGENT TEST PASSED")
          print("Papers found:", result["paper_count"])
          print("Literature review:", result["literature_review"][:300])
          print("Hypothesis:", result["hypothesis"][:300])
          PY

# Retest with Gemini 503 retry handling

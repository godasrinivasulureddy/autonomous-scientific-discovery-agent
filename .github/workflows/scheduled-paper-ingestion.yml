
name: Scheduled Scientific Paper Ingestion

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-paper-ingestion
  cancel-in-progress: false

jobs:
  ingest-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest ArXiv and PubMed papers into Pinecone
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          INGESTION_TOPIC: "machine learning drug discovery"
          INGESTION_MAX_RESULTS: "2"
        run: python -m services.scheduled_ingestion


name: Gemini Live API Test

on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Test Gemini API and Agent Orchestration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from services.gemini_service import generate_response
          from agents.orchestrator import run_research_workflow

          # Test 1: Gemini API connection
          response = generate_response(
              "Reply with exactly: Gemini connection successful"
          )
          assert "Gemini connection successful" in response
          print("GEMINI API CONNECTION PASSED")

          # Test 2: Agent orchestration
          result = run_research_workflow(
              research_topic="Machine Learning in Healthcare",
              paper_text=(
                  "This illustrative study compares logistic "
                  "regression and random forest models for "
                  "classification using precision, recall, "
                  "and F1-score."
              ),
          )

          assert result["literature_review"].strip()
          assert result["hypothesis"].strip()
          assert result["experiment"]["status"] == "not_executed"

          print("AGENT ORCHESTRATION PASSED")
          print("Literature review:", result["literature_review"][:300])
          print("Hypothesis:", result["hypothesis"][:300])
          PY

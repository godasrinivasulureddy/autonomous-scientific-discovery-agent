
name: Gemini Live API and Model Availability Test

on:
  push:
    branches:
      - feature/agent-orchestration
    paths:
      - ".github/workflows/gemini-live-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Verify Gemini model availability
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          models = list(client.models.list())

          assert models, "No Gemini models returned."

          print(
              f"GEMINI MODEL AVAILABILITY PASSED: "
              f"{len(models)} models found"
          )
          PY

      - name: Test real Gemini response
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from services.gemini_service import generate_response

          result = generate_response(
              "Reply with exactly: Gemini connection successful"
          )

          print("Gemini response:", result)




          if not isinstance(result, str) or not result.strip():
              raise RuntimeError("Gemini returned an empty response.")

          print("LIVE GEMINI API TEST PASSED")
          PY

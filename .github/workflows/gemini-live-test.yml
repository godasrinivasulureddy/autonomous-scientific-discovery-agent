
name: Gemini Model Availability Check

on:
  push:
    branches:
      - feature/agent-orchestration
    paths:
      - ".github/workflows/gemini-live-test.yml"
  workflow_dispatch:

jobs:
  check-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: python -m pip install google-genai

      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          for model in client.models.list():
              name = model.name
              actions = getattr(model, "supported_actions", [])
              if "generateContent" in actions:
                  print(name)
          PY

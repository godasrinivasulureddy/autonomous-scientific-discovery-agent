
name: PDF to Pinecone Live Test

on:
  push:
    paths:
      - ".github/workflows/pdf-pinecone-live-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pdf-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test PDF extraction and Pinecone storage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          python - <<'PY'
          import time
          import requests
          import fitz

          from services.paper_fetcher import search_arxiv
          from services.vector_store import (
              store_paper,
              paper_exists,
          )

          papers = search_arxiv(
              "machine learning",
              max_results=3,
          )

          assert papers, "No ArXiv papers found."

          paper = papers[0]
          print(f"Testing PDF: {paper.paper_id}")

          response = requests.get(
              paper.url,
              timeout=60,
              headers={"User-Agent": "ScientificDiscoveryAgent/1.0"},
          )
          response.raise_for_status()

          assert response.content.startswith(b"%PDF"), (
              "Downloaded content is not a PDF."
          )

          with fitz.open(
              stream=response.content,
              filetype="pdf",
          ) as document:
              text = "\n".join(
                  page.get_text()
                  for page in document
              )

          text = " ".join(text.split())

          assert len(text) > 500, (
              "Insufficient text extracted from PDF."
          )

          print(f"PDF TEXT EXTRACTION PASSED: {len(text)} characters")

          test_id = f"pdf-test:{paper.paper_id}"

          result = store_paper(
              paper_id=test_id,
              title=paper.title,
              text=text[:12000],
              source="arxiv-pdf",
              url=paper.url,
          )

          assert result["status"] == "stored"
          assert result["chunk_count"] >= 1

          for attempt in range(6):
              if paper_exists(test_id):
                  print("PDF TO PINECONE LIVE TEST PASSED")
                  print(f"Chunks: {result['chunk_count']}")
                  break
              time.sleep(5)
          else:
              raise AssertionError(
                  "PDF content was not found in Pinecone."
              )
          PY


name: Docker Sandbox Live Test

on:
  push:
    paths:
      - ".github/workflows/docker-live-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Build sandbox image
        run: docker build -t scientific-agent-sandbox:latest ./sandbox

      - name: Test real Docker execution and restrictions
        run: |
          python - <<'PY'
          from services.docker_sandbox import run_in_sandbox

          result = run_in_sandbox(
              "print('Docker sandbox working')"
          )
          assert result["status"] == "success", result
          assert "Docker sandbox working" in result["stdout"]
          print("DOCKER EXECUTION PASSED")

          result = run_in_sandbox(
              "import os; print(os.getuid())"
          )
          assert result["status"] == "success", result
          assert result["stdout"].strip() == "10001"
          print("NON-ROOT EXECUTION PASSED")

          result = run_in_sandbox(
              "open('/sandbox/test.txt', 'w').write('test')"
          )
          assert result["status"] == "error", result
          print("READ-ONLY FILESYSTEM PASSED")

          result = run_in_sandbox(
              "import socket; s = socket.socket(); "
              "s.settimeout(2); s.connect(('1.1.1.1', 80))"
          )
          assert result["status"] == "error", result
          print("NETWORK ISOLATION PASSED")

          result = run_in_sandbox(
              "while True: pass",
              timeout=2,
          )
          assert result["status"] == "timeout", result
          print("TIMEOUT HANDLING PASSED")
          PY

      - name: Test approved statistical experiment in Docker
        run: |
          python - <<'PY'
          from agents.code_executor import execute_experiment_in_docker

          result = execute_experiment_in_docker(
              experiment_name="descriptive_statistics",
              values=[10, 20, 30, 40],
          )

          assert result["status"] == "success", result
          assert result["sample_size"] == 4
          assert result["mean"] == 25
          assert round(result["standard_deviation"], 2) == 12.91

          print("APPROVED DOCKER EXPERIMENT PASSED")

          try:
              execute_experiment_in_docker(
                  experiment_name="unapproved_experiment",
                  values=[10, 20, 30],
              )
          except ValueError:
              print("UNAPPROVED EXPERIMENT REJECTED")
          else:
              raise AssertionError(
                  "Unapproved experiment was not rejected."
              )
          PY

      - name: Test Docker experiment feedback pipeline
        run: |
          python - <<'PY'
          from agents.orchestrator import run_experiment_with_feedback

          result = run_experiment_with_feedback(
              values=[10, 20, 30, 40],
          )

          experiment = result["experiment"]
          feedback = result["feedback"]

          assert experiment["status"] == "success", experiment
          assert experiment["sample_size"] == 4
          assert experiment["mean"] == 25
          assert round(experiment["standard_deviation"], 2) == 12.91

          assert feedback["accepted"] is True
          assert feedback["reward"] == 0.04
          assert feedback["feedback"]

          print("DOCKER EXPERIMENT PASSED")
          print("FEEDBACK AGENT PASSED")
          print("REWARD CALCULATION PASSED")
          print("COMPLETE FEEDBACK PIPELINE PASSED")
          PY

      - name: Test reward-based learning loop
        run: |
          python - <<'PY'
          from agents.orchestrator import run_learning_experiments

          result = run_learning_experiments(
              experiment_options={
                  "small_sample": [10, 20, 30, 40],
                  "large_sample": list(range(20)),
              },
              rounds=5,
              history_path="data/learning_history.json",
          )

          assert result["rounds"] == 5
          assert len(result["history"]) == 5

          for entry in result["history"]:
              assert entry["experiment"]["status"] == "success"
              assert entry["feedback"]["accepted"] is True
              assert 0 <= entry["reward"] <= 1

          print("REWARD-BASED LEARNING LOOP PASSED")
          print("EXPERIMENT SELECTION PASSED")
          print("DOCKER AND FEEDBACK INTEGRATION PASSED")
          PY

      - name: Upload learning history artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-learning-history
          path: data/learning_history.json
          if-no-files-found: error
          retention-days: 30

      - name: Check no sandbox containers remain
        run: |
          if docker ps -a --format '{{.Names}}' | grep '^scientific-sandbox-'; then
            echo "Sandbox container cleanup failed"
            exit 1
          fi
          echo "CONTAINER CLEANUP PASSED"
